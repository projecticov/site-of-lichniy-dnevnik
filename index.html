  ${all.map((s,i)=>{const k=P.sel.indexOf(s);return `<button class="gi ${k>-1?'sel':''}" data-a="pickPh" data-v="${i}" style="background-image:url(${s})">${P.multi?`<span class="n">${k>-1?k+1:''}</span>`:''}</button>`}).join('')}</div></div></section>`;
  $('#upl').addEventListener('change',e=>{const files=[...e.target.files];let left=files.length;files.forEach(f=>{const r=new FileReader();r.onload=()=>{USER_PHOTOS.unshift(r.result);S.pick.sel.push(r.result);if(--left===0)go('picker')};r.readAsDataURL(f)})})};
A.pickClose=()=>{if(S.adding&&S.draft){S.adding=null;go('editor')}else go(S.tab)};
A.pickPh=v=>{const s=allPhotos()[+v],P=S.pick,k=P.sel.indexOf(s);
  if(!P.multi)P.sel=[s];else if(k>-1)P.sel.splice(k,1);else if(P.sel.length<10)P.sel.push(s);const sc=$('.scroll').scrollTop;go('picker');$('.scroll').scrollTop=sc};

/* a day holds several posts; each post is one photo or a collage with its own text, stickers and drawing */
const PF=['photos','slide','layout','filter','userFilter','texts','sticks','drawing','caption'];
const newPost=(photos,layout)=>({photos,slide:0,layout:layout||'single',filter:'none',userFilter:false,texts:[],sticks:[],drawing:null,caption:''});
const autoLayout=n=>n<=1?'single':n===2?'v2':n===3?'big':'g4';
function savePost(){const dr=S.draft;if(!dr||!dr.posts)return;const p={};PF.forEach(k=>p[k]=dr[k]);dr.posts[dr.cur]=p}
function loadPost(i){const dr=S.draft;dr.cur=i;PF.forEach(k=>dr[k]=dr.posts[i][k])}
A.toEditor=()=>{const sel=[...S.pick.sel];if(!sel.length)return;

/* ---------- layers (override the viewer's renderer so both use the same look) ---------- */
function textStyle(l){const fx=l.fx==='outline'?`color:transparent;-webkit-text-stroke:1.6px ${l.c}`:l.fx==='glow'?`color:#fff;text-shadow:0 0 6px ${l.c},0 0 18px ${l.c},0 0 34px ${l.c}`:`color:${l.c}`;
  const bg=l.bg==='solid'?`background:${l.bgc||l.c};${l.bgc?'':`color:${isLight(l.c)?'#111':'#fff'}`}`:l.bg==='soft'?'background:rgba(0,0,0,.4)':'';
  return `${fontCss(l.f)};font-size:${l.s}px;text-align:${l.al||'center'};${l.bg==='solid'&&!l.bgc?'':fx};${bg}`}
layerHTML=function(l,i,kind,day){if(kind==='t')return `<div class="layer txt" data-k="t" data-i="${i}" style="left:${l.x}%;top:${l.y}%;${textStyle(l)}"><span class="tx ${l.anim&&l.anim!=='none'?'an-'+l.anim:''}">${esc(l.t)}</span></div>`;
  return `<div class="layer stk" data-k="s" data-i="${i}" style="left:${l.x}%;top:${l.y}%">${stickerHTML(l,day)}</div>`};
stickerHTML=function(l,day){const t=trk(day.track),x=fmt(day.date);
  if(l.type==='music'){if(!t)return '';const st=l.st||'light';
    if(st==='cover')return `<div class="m-cover"><div class="cv" style="${coverBG(t)}"></div><b>${esc(t.t)}</b><span>${esc(t.a)}</span></div>`;
    if(st==='vinyl')return `<div class="m-vinyl"><div class="disc"><div class="lbl" style="${coverBG(t)}"></div></div><div><b>${esc(t.t)}</b><span>${esc(t.a)}</span></div></div>`;
    if(st==='lyric')return `<div class="m-lyric"><span class="ic">${G.music}</span><div>${esc(t.t)}<br>${esc(t.a)}</div></div>`;
    return `<div class="m-card ${st==='dark'?'dark':''}"><span class="cv" style="${coverBG(t)}"></span><div><b>${esc(t.t)}</b><span>${esc(t.a)}</span></div></div>`}
  if(l.type==='date')return l.st==='big'?`<div class="s-date big">${x.d} ${x.ms}</div>`:`<div class="s-date">${x.wd}, ${x.d} ${x.m}</div>`;
  if(l.type==='pill')return `<div class="s-pill ${l.grad?'grad':''}">${IC[l.icon]||''}${esc(l.label)}</div>`;
  if(l.type==='mood')return `<div class="s-mood">${esc(l.label)}</div>`;
  if(l.type==='quote')return `<div class="s-quote">«${esc(l.label)}»</div>`;
  if(l.type==='time')return `<div class="s-date" style="font-size:22px;background:rgba(0,0,0,.45);color:#fff">${esc(l.label)}</div>`;
  return ''};

function bindStage(){const st=$('#stage'),tr=$('#trash');let drag=null;

const PENS=[['pen','Ручка'],['penArrow','Стрелка'],['marker','Маркер'],['neon','Неон'],['eraser','Ластик']];
A.drawMode=()=>{S.more=false;go('editor');S.dm={tool:'pen',c:'#ffffff',size:10,hist:[],page:0};
  const st=$('#stage'),cv=document.createElement('canvas');cv.className='drawcv';const r=st.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;st.appendChild(cv);

  ['.ig-tools','.ig-x','.caption','.minis'].forEach(s=>{const e=$(s);if(e)e.style.display='none'});renderDM();
  let last=null,start=null;
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}S.dm.hist.push(x.getImageData(0,0,cv.width,cv.height));const b=cv.getBoundingClientRect();last=start={x:e.clientX-b.left,y:e.clientY-b.top};dot(last)});
  cv.addEventListener('pointermove',e=>{if(!last)return;const b=cv.getBoundingClientRect(),p={x:e.clientX-b.left,y:e.clientY-b.top};seg(last,p);last=p});
  cv.addEventListener('pointerup',()=>{if(last&&S.dm.tool==='penArrow'&&start)head(start,last);last=null});
  function style(){const D=S.dm;x.globalCompositeOperation=D.tool==='eraser'?'destination-out':'source-over';x.globalAlpha=D.tool==='marker'?.55:1;x.lineCap=D.tool==='marker'?'square':'round';x.lineJoin='round';x.shadowBlur=0}
  function seg(a,b){const D=S.dm;style();if(D.tool==='neon'){x.shadowColor=D.c;x.shadowBlur=18;x.strokeStyle=D.c;x.lineWidth=D.size;line(a,b);x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=D.size*.35;line(a,b);return}
    x.strokeStyle=D.c;x.lineWidth=D.tool==='marker'?D.size*2.2:D.tool==='eraser'?D.size*2.5:D.size;line(a,b)}
  function line(a,b){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}
  function dot(p){seg(p,{x:p.x+.1,y:p.y+.1})}

function renderDM(){const D=S.dm,old=$('.dr2');if(old)old.remove();const el=document.createElement('div');el.className='dr2';const cols=TCOLORS.slice(D.page*8,D.page*8+8);

function analyze(dr){const txt=(dr.note.title+' '+dr.note.text+' '+dr.note.mood.join(' ')).toLowerCase(),t=trk(dr.track);
  const sc={warm:0,tense:0,calm:0,cozy:0,sad:0,joy:0};const kw={warm:['тепл','лист','осен','какао','солн','обним','нежн'],tense:['дедлайн','сдач','офис','ночь','кофе','устал','драйв','быстр','работ','проект'],calm:['тих','снег','одна','один','утр','тишин','свеж','медлен'],cozy:['дожд','кафе','кофейн','книг','дома','плед','чай','уют'],sad:['груст','закат','прощ','последн','скуч','ностальг','море'],joy:['смех','смеял','друз','весн','праздн','радост','танц','пикник','свобод']};
  Object.entries(kw).forEach(([k,ws])=>ws.forEach(w=>{if(txt.includes(w))sc[k]+=1}));

  const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0][0];
  const map={warm:['monet','Мазки и свет Клода Моне','letter','тёплый, спокойный'],tense:['kandinsky','Кандинский: линии и пятна','mono','собранный, быстрый'],calm:['zen','Японский минимализм','garamond','тихий, медленный'],cozy:['film','Плёночная фотография','hand','тёплый, негромкий'],sad:['dusk','Сумерки и плёнка','serif','мягкий, задумчивый'],joy:['bloom','Коллаж и пастель','soft','живой, звонкий']}[top];
  const tech={monet:'Мазки и свет Клода Моне',kandinsky:'Кандинский: линии и пятна',zen:'Японский минимализм',film:'Плёночная фотография',dusk:'Сумерки и плёнка',bloom:'Коллаж и пастель',noir:'Чёрно-белая плёнка'};
  if(dr.userFilter&&tech[dr.filter])map[1]=tech[dr.filter];
  const words=Object.values(kw).flat().filter(w=>txt.includes(w));
  return{top,filter:dr.userFilter?dr.filter:map[0],technique:map[1],font:map[2],voice:map[3],words,title:genTitle(txt,dr.date)}}

/* ---------- day viewer: swipeable posts, no timer ---------- */
function postsOf(d){if(d.posts)return d.posts;return d.photos.map((p,i)=>({photos:[p],layout:'single',filter:d.filter,texts:i===0?d.texts:[],sticks:i===0?d.sticks:[],drawing:i===0?d.drawing:null,caption:i===0?d.caption||'':''}))}
function postHTML(p,d){p=p||{};if(!Array.isArray(p.photos)||!p.photos.length)p.photos=(d&&d.photos)||[];if(!Array.isArray(p.texts))p.texts=[];if(!Array.isArray(p.sticks))p.sticks=[];const f=flt(p.filter||d.filter),L=LAYOUTS[p.layout]||LAYOUTS.single;
  const bg=p.layout==='single'||p.photos.length<2?`<div class="photo" style="background-image:url(${src(p.photos[0])});filter:${f.css}"></div>`
   :`<div class="collage" style="${L.css}">${Array.from({length:L.n},(_,i)=>`<div class="photo" style="background-image:url(${src(p.photos[i%p.photos.length])});filter:${f.css}${p.layout==='big'&&i===0?';grid-column:1/3':''}"></div>`).join('')}</div>`;
  return `<div class="vpost ${f.grain?'grain':''}">${bg}<div class="tint" style="background:${f.tint}"></div><div class="vshade"></div>${p.drawing?`<img class="drawimg" src="${p.drawing}" alt="">`:''}
  ${(p.texts||[]).map((l,j)=>layerHTML(l,j,'t',d)).join('')}${(p.sticks||[]).map((l,j)=>layerHTML(l,j,'s',d)).join('')}${p.caption?`<div class="caption" style="bottom:16px">${esc(p.caption)}</div>`:''}</div>`}

/* folders: days on a curved wheel, the centred one opens */
function arcRows(list){if(!list.length)return '<div class="empty">Ничего не нашлось</div>';
  return list.map(d=>{const x=fmt(d.date),t=trk(d.track);return `<div class="arc" data-id="${d.id}"><button class="disc" data-a="open" data-v="${d.id}" style="background-image:url(${src(d.photos[0])});filter:${flt(d.filter).css}" aria-label="${esc(d.title)}"></button>
   <span class="tx"><b>${esc(d.title)}</b><span>${x.d} ${x.m}${t?' · '+esc(t.a):''}</span></span><button class="go pill sk" data-a="open" data-v="${d.id}">Открыть</button></div>`}).join('')}
function bendArc(){const w=$('#arcw');if(!w)return;const r=w.getBoundingClientRect(),cy=r.top+r.height/2;let best=null,bd=1e9;
  w.querySelectorAll('.arc').forEach(el=>{const b=el.getBoundingClientRect(),o=(b.top+b.height/2-cy)/(r.height/2),a=Math.abs(o);
    el.style.transform=`translateX(${Math.min(140,a*a*120+a*30)}px) rotate(${o*24}deg)`;el.style.opacity=Math.max(.12,1-a*.85);el.classList.remove('center');if(a<bd){bd=a;best=el}});
  if(best&&bd<.25)best.classList.add('center')}
SCREENS.folders=()=>{const sorted=[...DAYS].sort((a,b)=>b.date.localeCompare(a.date));
  app.innerHTML=`<section class="screen"><header class="topbar"><div class="logo" style="font-size:30px">Папки</div><div class="grow"></div><button class="ibtn" data-a="newDay" aria-label="Новый день">${IC.plus}</button></header>
  <label class="fsearch sk">${IC.search}<input id="fsearch" placeholder="Снег, море, Кино…"></label>
  <div style="position:relative;flex:1;min-height:0;display:flex"><div class="arcpill sk"></div><div class="arcwrap" id="arcw">${arcRows(sorted)}</div></div>${tabbar('folders')}</section>`;
  const w=$('#arcw');w.style.paddingBlock=Math.max(0,w.clientHeight/2-52)+'px';w.addEventListener('scroll',bendArc,{passive:true});w.scrollTop=104;requestAnimationFrame(bendArc);
  $('#fsearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();w.innerHTML=arcRows(sorted.filter(d=>(d.title+' '+d.note+' '+(trk(d.track)||{}).t+' '+(trk(d.track)||{}).a+' '+d.mood.join(' ')).toLowerCase().includes(q)));w.scrollTop=0;requestAnimationFrame(bendArc)})};

/* Vivere — запуск PWA: восстановление данных, синхронизация с D1, установка на экран.
   Порядок: localStorage (мгновенно) → фоновый досыл outbox → sync с облаком.
   Никогда не затираем локальные данные устаревшим ответом сервера. */
(function (App) {
  'use strict';

  const api = App.api;
  const ui = App.ui;

  const DEMO_IDS = new Set(['d1', 'd2', 'd3', 'd4', 'd5', 'd6']);
const LS_IDS = 'vivere:myIds:v1';

/* id всех когда-либо созданных на этом устройстве дней — страховка при смене ключа */
function rememberId(id) {
  try {
    const ids = JSON.parse(localStorage.getItem(LS_IDS) || '[]');
    if (!ids.includes(id)) { ids.push(id); localStorage.setItem(LS_IDS, JSON.stringify(ids.slice(-400))); }
  } catch (_) {}
}
function myIds() {
  try { return JSON.parse(localStorage.getItem(LS_IDS) || '[]'); } catch (_) { return []; }
}

  /* в формат облака: id, date, title, note, mood, payload (всё оформление) */
  function toCloud(day) {
    return {
      id: day.id,
      date: day.date,
      title: day.title,
      note: String(day.note || '').slice(0, 4000),
      mood: (Array.isArray(day.mood) ? day.mood.join(', ') : String(day.mood || '')).slice(0, 120),
      payload: day,
    };
  }

  App.sync = {
    status: 'локально',
    pending() {
      return api.outboxCount();
    },
    /* полный снимок на устройство + в облако при первом подключении */
    async pull() {
      if (!api.enabled()) {
        App.sync.status = 'офлайн';
        paint();
        return;
      }
      try {
        App.sync.status = 'синхронизация';
        paint();
        /* выгружаем в облако только пользовательские дни: демо-набор живёт в коде */
        const own = window.DAYS.filter((d) => !DEMO_IDS.has(d.id));
        const res = await api.syncDays(own.map(toCloud));
        if (res.ok && Array.isArray(res.days)) {
          const seen = new Set(window.DAYS.map((d) => d.id));
          let added = 0;
          for (const row of res.days) {
            if (!row || !row.id) continue;
            if (seen.has(row.id)) continue;
            /* демо-дни не добавляем повторно только если они уже в памяти
               (в облаке они могут лежать после первого подключения) */
            const day = row.payload && row.payload.id ? row.payload : {
              id: row.id, date: row.date, title: row.title, note: row.note || '',
              mood: String(row.mood || '').split(',').map((s) => s.trim()).filter(Boolean),
              photos: [], posts: [], filter: 'none', technique: '—', font: 'hand', paper: 'cream', ink: '#2b2118',
            };
            window.DAYS.push(day);
            seen.add(row.id);
            added++;
          }
          /* страховка: если ключ устройства сменился, добираем свои дни по запомненным id */
          const have = new Set(window.DAYS.map((d) => d.id));
          for (const id of myIds()) {
            if (have.has(id)) continue;
            try {
              const one = await fetch(api.base.replace(/\/$/, '') + '/api/days/' + encodeURIComponent(id), {
                headers: { Authorization: 'Bearer ' + api.getClientKey() },
              });
              if (!one.ok) continue;
              const jd = await one.json();
              const day = jd && jd.day && jd.day.payload && jd.day.day !== null ? jd.day.payload : null;
              if (day && day.id && !have.has(day.id)) { window.DAYS.push(day); have.add(day.id); added++; }
            } catch (_) {}
          }
          if (added && window.go) window.go('home');
          App.sync.status = 'облако';
        }
      } catch (e) {
        App.sync.status = 'офлайн';
      }
      paint();
    },
    /* создание/правка/удаление дня */
    async push(kind, day) {
      if (!api.enabled()) { paint(); return { localOnly: true }; }
      try {
        if (kind === 'delete') {
          const r = await api.pushMutation('DELETE', '/api/days/' + encodeURIComponent(day.id));
          paintWith(r.queued ? 'очередь' : 'облако');
          return r;
        }
        const r = await api.pushMutation('POST', '/api/days', toCloud(day));
        paintWith(r.queued ? 'очередь' : 'облако');
        return r;
      } catch (_) {
        paintWith('офлайн');
        return { ok: false };
      }
    },
    async rename(day) {
      if (!api.enabled()) return;
      await api.pushMutation('PATCH', '/api/days/' + encodeURIComponent(day.id), toCloud(day));
    },
  };

  function paintWith(st) { App.sync.status = st; paint(); }

  function paint() {
    const el = document.getElementById('syncState');
    if (!el) return;
    const st = App.sync.status;
    const n = api.outboxCount();
    const map = {
      'облако': ['☁︎', 'В облаке'],
      'локально': ['⤓', 'На устройстве'],
      'офлайн': ['⌁', 'Офлайн · сохранено'],
      'очередь': ['↻', 'Дошлём при сети' + (n ? ' (' + n + ')' : '')],
      'синхронизация': ['↻', 'Синхронизация…'],
    };
    const v = map[st] || map['локально'];
    el.innerHTML = '<i>' + v[0] + '</i><span>' + v[1] + '</span>';
    el.dataset.state = st;
  }

  /* статус в настройках/меню дня */
  App.syncPanelHTML = function () {
    const st = App.sync.status;
    const n = api.outboxCount();
    const cloud = api.enabled();
    const base = (api.base || '').replace(/^https?:\/\//, '');
    return (
      '<div class="syncpanel">' +
      '<div class="row"><b>Хранилище</b><span>' + (st === 'облако' ? 'Cloudflare D1' : st === 'офлайн' ? 'только устройство' : 'на устройстве') + '</span></div>' +
      '<div class="row"><b>Сервер</b><span>' + (cloud ? base : 'не подключён') + '</span></div>' +
      '<div class="row"><b>Очередь</b><span>' + (n ? n + ' операц. ждут сети' : 'пусто') + '</span></div>' +
      '<div class="row"><b>Ключ устройства</b><span>' + api.getClientKey().slice(0, 12) + '…</span></div>' +
      '</div>'
    );
  };

  function boot() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    document.documentElement.classList.toggle('pwa-standalone', isStandalone);

    ui.initBackGuard();
    ui.initSW();
    ui.initViewport();

    /* install prompt */
    let prompt = null;
    window.addEventListener('beforeinstallprompt', (ev) => {
      ev.preventDefault();
      prompt = ev;
      const b = document.getElementById('installBtn');
      if (b) b.hidden = false;
    });
    window.addEventListener('appinstalled', () => {
      const b = document.getElementById('installBtn');
      if (b) b.hidden = true;
    });
    window.__vivereInstall = async () => {
      if (!prompt) { ui.toast('Откройте меню браузера → «Установить приложение»'); return; }
      prompt.prompt();
      try { await prompt.userChoice; } catch (_) {}
      prompt = null;
      const b = document.getElementById('installBtn');
      if (b) b.hidden = true;
    };

    window.addEventListener('online', () => App.sync.pull());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') paint();
    });

    /* отмечаем изменённый день и синхронизируем */
    window.VPersist = function (reason) {
      try {
        const state = { days: window.DAYS, savedAt: new Date().toISOString() };
        api.saveLocal(state);
      } catch (_) {}
      try { window.DAYS.forEach((d) => { if (d && d.id && !DEMO_IDS.has(d.id)) rememberId(d.id); }); } catch (_) {}
      paint();
      if (reason === 'delete' || reason === 'update' || reason === 'create' || reason === 'rename' || reason === 'dup') {
        const S = (window.__vivereCore && window.__vivereCore.S) || window.S || {};
        const last =
          window.DAYS.find((d) => d.id === (S.lastId || (S.lastEditDay && S.lastEditDay.id))) ||
          window.__vivereLastDay ||
          null;
        if (reason === 'delete' && window.__lastDeletedId) {
          App.sync.push('delete', { id: window.__lastDeletedId });
          window.__lastDeletedId = null;
        } else if (last) {
          if (reason === 'rename' || reason === 'update') App.sync.rename(last);
          else App.sync.push('create', last);
        }
      }
    };

    App.sync.pull();
  }

  document.addEventListener('DOMContentLoaded', boot);
})(window.Vivere = window.Vivere || {});

Vivere.api.configure('https://vivere-diary-api.warfacewtat.workers.dev');
</script>
